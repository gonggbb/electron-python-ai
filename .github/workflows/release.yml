name: Build and Publish

on:
  # 手动触发（推荐先用这个测试）
  workflow_dispatch:
  # 或推送 v* 标签时自动发布
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 必须：允许创建/更新 Release

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux 需要额外系统依赖（deb/rpm）
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 如有代码签名证书，可在这里注入环境变量
          # CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: npm run publish
